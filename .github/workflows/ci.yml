name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Static analysis
        run: ./gradlew detekt --no-daemon
      - name: Unit tests
        run: ./gradlew :core:designsystem:desktopTest :feature:home:desktopTest :feature:nav:desktopTest :desktopApp:test --tests "*RepositoryUnitTest*" --tests "*ReplyRepositoryTest*" --no-daemon
      - name: Assemble
        run: ./gradlew :androidApp:assembleDebug :desktopApp:jar --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reply-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
